name: Build APK

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle (cache + verifikasi wrapper)
        uses: gradle/actions/setup-gradle@v6

      - name: Bump versionCode otomatis per build
        run: |
          CODE=$((100000 + ${{ github.run_number }}))
          for F in app-sender/build.gradle.kts app-receiver/build.gradle.kts; do
            sed -i "s/versionCode = [0-9]*/versionCode = ${CODE}/" "$F"
            echo "versionCode baru (${F}): ${CODE}"
          done

      - name: Build debug APK
        run: ./gradlew :app-sender:assembleDebug :app-receiver:assembleDebug

      - name: Lint & unit test
        run: ./gradlew :app-sender:lintDebug :app-sender:testDebugUnitTest :app-receiver:lintDebug :app-receiver:testDebugUnitTest :protocol:lintDebug :protocol:testDebugUnitTest

      - name: Tampilkan laporan lint di log
        if: always()
        run: cat app-sender/build/reports/lint-results-debug.txt app-receiver/build/reports/lint-results-debug.txt protocol/build/reports/lint-results-debug.txt 2>/dev/null || true

      - name: Upload debug APK (sender)
        uses: actions/upload-artifact@v7
        with:
          name: app-sender-debug
          path: app-sender/build/outputs/apk/debug/app-sender-debug.apk

      - name: Upload debug APK (receiver)
        uses: actions/upload-artifact@v7
        with:
          name: app-receiver-debug
          path: app-receiver/build/outputs/apk/debug/app-receiver-debug.apk
