name: Build APK

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle (cache + verifikasi wrapper)
        uses: gradle/actions/setup-gradle@v6

      - name: Bump versionCode otomatis per build
        run: |
          CODE=$((100000 + ${{ github.run_number }}))
          for F in app-sender/build.gradle.kts app-receiver/build.gradle.kts; do
            sed -i "s/versionCode = [0-9]*/versionCode = ${CODE}/" "$F"
            echo "versionCode baru (${F}): ${CODE}"
          done

      - name: Lint & unit test
        run: ./gradlew :app-sender:lintRelease :app-sender:testDebugUnitTest :app-receiver:lintRelease :app-receiver:testDebugUnitTest :protocol:lintDebug :protocol:testDebugUnitTest

      - name: Build release APK (jika secret signing tersedia)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ./gradlew :app-sender:assembleRelease :app-receiver:assembleRelease \
            -PstoreFile=keystore.jks \
            -PstorePassword="$KEYSTORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD"

      - name: Cek ukuran APK (jaga APK tetap kecil)
        if: always()
        run: |
          FAILED=0
          for APK in app-sender/build/outputs/apk/release/app-sender-release.apk app-receiver/build/outputs/apk/release/app-receiver-release.apk; do
            if [ -f "$APK" ]; then
              SIZE=$(stat -c %s "$APK")
              echo "Ukuran APK (${APK}): $SIZE bytes"
              if [ "$SIZE" -gt 4194304 ]; then
                echo "::error::APK terlalu besar: $SIZE > 4194304 bytes"
                FAILED=1
              fi
            fi
          done
          exit $FAILED

      - name: Upload release APK (sender)
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: app-sender-release
          path: app-sender/build/outputs/apk/release/app-sender-release.apk

      - name: Upload release APK (receiver)
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: app-receiver-release
          path: app-receiver/build/outputs/apk/release/app-receiver-release.apk

      - name: VirusTotal scan (cek false-positive antivirus)
        if: env.KEYSTORE_BASE64 != '' && secrets.VT_API_KEY != ''
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          for APK in app-sender/build/outputs/apk/release/app-sender-release.apk app-receiver/build/outputs/apk/release/app-receiver-release.apk; do
            [ -f "$APK" ] || continue
            NAME=$(basename "$APK")
            HASH=$(sha256sum "$APK" | cut -d' ' -f1)
            echo "== VirusTotal: $NAME ($HASH) =="
            # Cek laporan yang sudah ada dulu (hemat kuota).
            RESP=$(curl -s -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/files/$HASH")
            STATS=$(echo "$RESP" | python3 -c "import json,sys; a=json.load(sys.stdin).get('data',{}).get('attributes',{}).get('last_analysis_stats',{}); print(a.get('malicious',0), a.get('suspicious',0), a.get('undetected',0), a.get('harmless',0))" 2>/dev/null || true)
            if [ -z "$STATS" ]; then
              AID=$(curl -s -X POST "https://www.virustotal.com/api/v3/files" -H "x-apikey: $VT_API_KEY" -F "file=@$APK" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['id'])" 2>/dev/null || true)
              if [ -z "$AID" ]; then
                echo "Gagal upload ke VirusTotal (kuota/jaringan) — dilewati."
                continue
              fi
              echo "Analysis id: $AID"
              for i in $(seq 1 12); do
                sleep 20
                R=$(curl -s -H "x-apikey: $VT_API_KEY" "https://www.virustotal.com/api/v3/analyses/$AID")
                ST=$(echo "$R" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['attributes'].get('status',''))" 2>/dev/null || true)
                if [ "$ST" = "completed" ]; then
                  echo "$R" | python3 -c "import json,sys; s=json.load(sys.stdin)['data']['attributes']['stats']; print('VirusTotal $NAME: malicious=%s suspicious=%s undetected=%s harmless=%s' % (s.get('malicious',0), s.get('suspicious',0), s.get('undetected',0), s.get('harmless',0)))"
                  break
                fi
              done
            else
              echo "VirusTotal $NAME (laporan lama): malicious=$(echo $STATS | cut -d' ' -f1) suspicious=$(echo $STATS | cut -d' ' -f2)"
            fi
            echo "Detail: https://www.virustotal.com/gui/file/$HASH/detection"
          done

      - name: Publish GitHub Release
        if: env.KEYSTORE_BASE64 != '' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app-sender/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app-sender/build.gradle.kts)
          cp app-sender/build/outputs/apk/release/app-sender-release.apk "tasirin-cast-sender-v${VER}-${CODE}.apk"
          cp app-receiver/build/outputs/apk/release/app-receiver-release.apk "tasirin-cast-receiver-v${VER}-${CODE}.apk"
          gh release delete "v${VER}" --yes --cleanup-tag || true
          gh release create "v${VER}" \
            "tasirin-cast-sender-v${VER}-${CODE}.apk" \
            "tasirin-cast-receiver-v${VER}-${CODE}.apk" \
            --title "Tasirin Cast v${VER} (build ${CODE})" \
            --notes "APK rilis resmi (build ${CODE}), ditandatangani kunci release. Sender = kirim layar, Receiver = terima layar. Unduh lalu pasang di HP/TV box." \
            --latest
